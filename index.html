<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APUSH Complete Reference</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0c09;
    --surface: #171410;
    --border: #2a2520;
    --accent: #c8963a;
    --accent2: #7fb5d4;
    --accent3: #9d7ec8;
    --text: #e8e0d4;
    --muted: #7a6f62;
    --tag-bg: #1e1a15;
    --events-accent: #c84a4a;
    --events-accent2: #d4916a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }
  .top-nav {
    display: flex;
    align-items: center;
    gap: 0;
    padding: 0 2rem;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 200;
  }
  .nav-brand {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    font-weight: 900;
    color: var(--accent);
    letter-spacing: -0.02em;
    padding: 1rem 0;
    margin-right: 2rem;
    white-space: nowrap;
  }
  .nav-brand span { color: var(--text); }
  .nav-tab {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--muted);
    padding: 0 1.2rem;
    height: 100%;
    display: flex;
    align-items: center;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    text-transform: uppercase;
    line-height: 3.5rem;
  }
  .nav-tab:hover { color: var(--text); }
  .nav-tab.active-people { color: var(--accent); border-bottom-color: var(--accent); }
  .nav-tab.active-events { color: var(--events-accent); border-bottom-color: var(--events-accent); }
  .page { display: none; }
  .page.active { display: block; }
  .people-header, .events-header {
    border-bottom: 1px solid var(--border);
    padding: 1.5rem 2rem 1.2rem;
    background: var(--bg);
  }
  .page-title, .events-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.3rem, 3vw, 1.9rem);
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .page-title { color: var(--accent); }
  .events-title { color: var(--events-accent); }
  .page-title span, .events-title span { color: var(--text); }
  .subtitle {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    margin-top: 3px;
    letter-spacing: 0.08em;
  }
  .controls, .events-controls {
    display: flex;
    gap: 0.75rem;
    margin-top: 1rem;
    flex-wrap: wrap;
    align-items: center;
  }
  #search, #event-search {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.5rem 1rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    width: 260px;
    outline: none;
    transition: border-color 0.2s;
  }
  #search:focus { border-color: var(--accent); }
  #event-search:focus { border-color: var(--events-accent); }
  #search::placeholder, #event-search::placeholder { color: var(--muted); }
  .era-filters, .type-filters { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .era-btn, .type-btn {
    background: var(--tag-bg);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 0.3rem 0.7rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: all 0.15s;
  }
  .era-btn:hover, .era-btn.active {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
  }
  .type-btn:hover, .type-btn.active {
    background: var(--events-accent);
    color: #fff;
    border-color: var(--events-accent);
  }
  #count, #event-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-left: auto;
  }
  main, .events-main {
    padding: 1.5rem 2rem;
    max-width: 1400px;
    margin: 0 auto;
  }
  .era-section, .events-era-section { margin-bottom: 3rem; }
  .era-heading, .events-era-heading {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    padding-left: 0.75rem;
    margin-bottom: 1rem;
    letter-spacing: 0.02em;
  }
  .era-heading {
    color: var(--accent2);
    border-left: 3px solid var(--accent2);
  }
  .events-era-heading {
    color: var(--events-accent2);
    border-left: 3px solid var(--events-accent2);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1px;
    background: var(--border);
  }
  .events-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 1px;
    background: var(--border);
  }
  .card, .event-card {
    background: var(--surface);
    padding: 1rem 1.25rem;
    transition: background 0.15s;
  }
  .card:hover, .event-card:hover { background: #1c1814; }
  .card-name, .event-name {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .card-name { color: var(--accent); }
  .event-name { color: var(--text); line-height: 1.3; margin-bottom: 0.4rem; }
  .card-dates, .event-year {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }
  .event-year {
    font-size: 11px;
    color: var(--events-accent);
    letter-spacing: 0.1em;
    margin-bottom: 3px;
    font-weight: 500;
  }
  .card-desc, .event-desc {
    font-size: 13px;
    color: #c4b9ab;
    line-height: 1.55;
  }
  .event-significance {
    font-size: 12px;
    color: var(--events-accent2);
    margin-top: 0.5rem;
    font-style: italic;
    border-top: 1px solid var(--border);
    padding-top: 0.4rem;
  }
  .card-tag, .event-tag {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.06em;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 1px 5px;
    margin-top: 0.4rem;
    margin-right: 3px;
    text-transform: uppercase;
  }
  .event-tag.type-war { color: #c84a4a; border-color: #3a1a1a; }
  .event-tag.type-law { color: #7fb5d4; border-color: #1a2a35; }
  .event-tag.type-economic { color: #c8963a; border-color: #352510; }
  .event-tag.type-social { color: #9d7ec8; border-color: #251a35; }
  .event-tag.type-political { color: #6ab87d; border-color: #1a2e20; }
  .event-tag.type-foreign { color: #d4916a; border-color: #352010; }
  .event-tag.type-civil-rights { color: #e8c55a; border-color: #352e10; }
  .event-tag.type-technology { color: #60c4c4; border-color: #10302e; }
  .no-results {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--muted);
    padding: 3rem;
    text-align: center;
    font-size: 12px;
  }
</style>
</head>

<script>
function switchTab(tab) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.className = 'nav-tab');
  document.getElementById('page-' + tab).classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active-' + tab);
}

  { name:"Zenger Trial", year:"1735", era:"Colonial", types:["law"], significance:"Early precedent for freedom of the press and truth as a defense in libel cases.", desc:"Printer John Peter Zenger was acquitted after criticizing New York's royal governor." },
  { name:"French & Indian War", year:"1754–1763", era:"Colonial", types:["war","foreign"], significance:"Massive British debt led to taxation of colonies, igniting the road to revolution.", desc:"The North American theater of the Seven Years' War pitted Britain against France and Native allies." },
  { name:"Albany Plan of Union", year:"1754", era:"Colonial", types:["political"], significance:"Early attempt at colonial unity; foreshadowed later intercolonial cooperation.", desc:"Benjamin Franklin proposed a plan to unite the colonies for common defense and Native relations. It failed, but it revealed that a shared colonial political structure was imaginable before independence." },
  { name:"Proclamation of 1763", year:"1763", era:"Colonial", types:["political","law"], significance:"Angered settlers and speculators by restricting westward expansion.", desc:"Britain prohibited colonial settlement west of the Appalachians after Pontiac's Rebellion." },

  { name:"Sugar Act", year:"1764", era:"Revolution", types:["law","political"], significance:"Raised colonial anger over taxation and customs enforcement; part of the road to revolution.", desc:"Parliament lowered the tax rate on molasses but increased enforcement against smuggling. Colonists objected not only to the tax but to Britain's growing effort to directly regulate colonial trade and raise revenue." },
  { name:"Stamp Act", year:"1765", era:"Revolution", types:["law","political"], significance:"First direct tax on colonies; sparked 'no taxation without representation' resistance.", desc:"Parliament imposed direct taxes on printed materials in the colonies." },
  { name:"Quartering Act", year:"1765", era:"Revolution", types:["law","political"], significance:"Increased colonial resentment toward standing armies and imperial control.", desc:"Required colonial assemblies to provide supplies and housing support for British troops stationed in America. Many colonists viewed it as another example of Parliament violating their rights." },
  { name:"Townshend Acts", year:"1767", era:"Revolution", types:["law","political"], significance:"Renewed colonial resistance with boycotts and sharpened the argument over Parliamentary authority.", desc:"These duties taxed imported goods such as glass, lead, paint, paper, and tea. Colonial protest revived through nonimportation and public agitation, especially in Boston." },
  { name:"Boston Massacre", year:"1770", era:"Revolution", types:["political","social"], significance:"Powerful patriot propaganda event used to depict British tyranny.", desc:"British soldiers fired into a crowd in Boston, killing five colonists." },
  { name:"Tea Act", year:"1773", era:"Revolution", types:["law","political"], significance:"Set off the Boston Tea Party by seeming to confirm Parliament's right to tax the colonies.", desc:"Parliament gave the British East India Company special privileges in tea sales, undercutting colonial merchants. Colonists saw it as a trick to get them to accept taxation without representation." },
  { name:"Boston Tea Party", year:"1773", era:"Revolution", types:["political"], significance:"Led directly to the Intolerable Acts and broader colonial unity.", desc:"Patriots dumped British tea into Boston Harbor in protest against imperial policy." },
  { name:"Intolerable Acts", year:"1774", era:"Revolution", types:["law","political"], significance:"Punished Massachusetts but unified the colonies in opposition to Britain.", desc:"Britain closed Boston Harbor, altered Massachusetts government, and tightened imperial control after the Tea Party. Colonists responded by forming the First Continental Congress." },
  { name:"First Continental Congress", year:"1774", era:"Revolution", types:["political"], significance:"Marked a major step toward unified resistance and intercolonial governance.", desc:"Delegates from twelve colonies met in Philadelphia to coordinate opposition to Britain. Though not yet a declaration for independence, it built the political machinery of colonial unity." },
  { name:"Lexington and Concord", year:"1775", era:"Revolution", types:["war"], significance:"First military clashes of the Revolutionary War.", desc:"British troops marched to seize colonial arms; colonial militia fought back, beginning open war." },
  { name:"Second Continental Congress", year:"1775", era:"Revolution", types:["political"], significance:"Created the Continental Army and functioned as the revolutionary national government.", desc:"Meeting after fighting had begun, delegates appointed George Washington commander and gradually assumed powers of war and diplomacy." },
  { name:"Declaration of Independence", year:"1776", era:"Revolution", types:["political","law"], significance:"Defined American democratic ideals and justified revolution.", desc:"Congress formally severed ties with Britain and articulated natural rights theory." },
  { name:"Articles of Confederation Adopted", year:"1777", era:"Revolution", types:["political","law"], significance:"Created the first national government but revealed the weakness of decentralized authority.", desc:"The Articles formed a loose confederation of states with a weak central government. Congress lacked power to tax directly or regulate commerce, problems that later fed calls for a new Constitution." },
  { name:"Battle of Saratoga", year:"1777", era:"Revolution", types:["war"], significance:"Turning point of the Revolutionary War; convinced France to ally with the U.S.", desc:"American victory over Burgoyne in New York persuaded France to support independence." },
  { name:"French Alliance", year:"1778", era:"Revolution", types:["foreign","war"], significance:"Brought crucial military and naval aid that made American victory possible.", desc:"France formally allied with the United States after Saratoga. French money, troops, officers, and naval power transformed the war." },
  { name:"Battle of Yorktown", year:"1781", era:"Revolution", types:["war"], significance:"Effectively ended major fighting in the Revolutionary War.", desc:"Combined American and French forces forced Cornwallis to surrender in Virginia." },
  { name:"Treaty of Paris", year:"1783", era:"Revolution", types:["foreign","law"], significance:"Recognized U.S. independence and granted territory to the Mississippi River.", desc:"Britain officially recognized the United States and ended the war." },
  { name:"Northwest Ordinance", year:"1787", era:"Revolution", types:["law","political"], significance:"Created an orderly process for western expansion and banned slavery in the Northwest Territory.", desc:"The Confederation Congress established a plan for territories to become equal states rather than permanent colonies. It also prohibited slavery north of the Ohio River, making it one of the most important early national laws." },
  { name:"U.S. Constitution Ratified", year:"1788", era:"Revolution", types:["political","law"], significance:"Created the framework of American government and federalism.", desc:"The Constitution was ratified after intense Federalist and Anti-Federalist debate." },
  { name:"Bill of Rights", year:"1791", era:"Revolution", types:["law"], significance:"Guaranteed core civil liberties and helped secure support for the Constitution.", desc:"The first ten amendments protected freedoms such as speech, religion, assembly, due process, and jury trial. Their adoption reassured critics of centralized power." },

  { name:"Washington's Neutrality Proclamation", year:"1793", era:"Early Republic", types:["foreign","political"], significance:"Set the precedent of avoiding entanglement in European wars.", desc:"Washington declared the U.S. neutral in the war between Britain and revolutionary France. The move split public opinion and revealed early partisan divisions over foreign policy." },
  { name:"Whiskey Rebellion", year:"1794", era:"Early Republic", types:["political"], significance:"Established that the federal government could enforce its laws.", desc:"Western farmers resisted a federal excise tax; Washington sent militia forces to suppress the revolt." },
  { name:"Jay Treaty", year:"1794", era:"Early Republic", types:["foreign","political"], significance:"Avoided war with Britain but fueled partisan anger and debate over executive diplomacy.", desc:"Negotiated by John Jay, the treaty resolved some lingering issues with Britain but was seen by many Republicans as too pro-British." },
  { name:"Alien & Sedition Acts", year:"1798", era:"Early Republic", types:["law","political"], significance:"Triggered a major debate over civil liberties and states' rights.", desc:"Federalists passed laws targeting immigrants and political dissent during tensions with France." },
  { name:"Virginia and Kentucky Resolutions", year:"1798–1799", era:"Early Republic", types:["political","law"], significance:"Introduced the theory that states could judge the constitutionality of federal laws.", desc:"Jefferson and Madison anonymously argued that states could interpose against unconstitutional federal actions. The resolutions later fed nullification and secession arguments." },
  { name:"Election of 1800", year:"1800", era:"Early Republic", types:["political"], significance:"Peaceful transfer of power between rival parties; often called the 'Revolution of 1800.'", desc:"Jefferson defeated Adams after a bitter partisan struggle. The result marked a crucial test of republican government and peaceful opposition." },
  { name:"Judiciary Act of 1801", year:"1801", era:"Early Republic", types:["law","political"], significance:"Sparked conflict over the courts and helped lead to Marbury v. Madison.", desc:"Federalists passed the act to create new judgeships before leaving office. Jeffersonians saw it as an attempt to entrench Federalist power in the judiciary." },
  { name:"Louisiana Purchase", year:"1803", era:"Early Republic", types:["political","foreign"], significance:"Doubled the size of the U.S. and opened huge questions about slavery and western governance.", desc:"Jefferson bought Louisiana Territory from France for $15 million." },
  { name:"Marbury v. Madison", year:"1803", era:"Early Republic", types:["law"], significance:"Established judicial review.", desc:"Chief Justice Marshall asserted the Supreme Court's power to strike down unconstitutional acts." },
  { name:"Embargo Act", year:"1807", era:"Early Republic", types:["law","economic","foreign"], significance:"Attempted peaceful coercion against Britain and France but badly damaged the American economy.", desc:"Jefferson banned American trade with foreign nations in response to European interference with U.S. shipping. The policy hurt New England merchants and proved deeply unpopular." },
  { name:"War of 1812", year:"1812–1815", era:"Early Republic", types:["war","foreign"], significance:"Produced nationalism and encouraged domestic manufacturing.", desc:"The U.S. fought Britain over trade, impressment, and frontier conflict." },
  { name:"Hartford Convention", year:"1814–1815", era:"Early Republic", types:["political"], significance:"Discredited the Federalist Party by making it seem disloyal during wartime.", desc:"New England Federalists met to protest the War of 1812 and discuss constitutional amendments. Rumors of disunion damaged them badly once the war ended in a burst of nationalism." },
  { name:"Monroe Doctrine", year:"1823", era:"Early Republic", types:["foreign","political"], significance:"Claimed the Western Hemisphere as a special U.S. sphere of interest.", desc:"Monroe warned European powers against further colonization in the Americas." },
  { name:"Missouri Compromise", year:"1820", era:"Early Republic", types:["law","political"], significance:"Temporarily eased sectional tensions over slavery expansion.", desc:"Missouri entered as a slave state, Maine as a free state, and slavery was barred north of 36°30' in the Louisiana Purchase." },
  { name:"Tariff of Abominations", year:"1828", era:"Early Republic", types:["law","economic","political"], significance:"Provoked Southern anger and helped trigger the nullification crisis.", desc:"This high protective tariff benefited Northern manufacturers but hurt the export-oriented South. South Carolina denounced it as unconstitutional and oppressive." },
  { name:"Indian Removal Act", year:"1830", era:"Early Republic", types:["law","political","social"], significance:"Established forced removal as federal policy and led directly to the Trail of Tears.", desc:"Congress authorized the president to negotiate Native removal west of the Mississippi." },
  { name:"Nat Turner's Rebellion", year:"1831", era:"Early Republic", types:["social","political"], significance:"Deepened Southern fears and led to harsher slave codes.", desc:"Nat Turner led an enslaved uprising in Virginia that killed dozens of white people. The revolt was suppressed, but it intensified sectional anxiety over slavery." },
  { name:"Worcester v. Georgia", year:"1832", era:"Early Republic", types:["law"], significance:"Recognized Cherokee sovereignty in theory, though the federal government failed to enforce it.", desc:"The Supreme Court ruled that Georgia laws had no force within Cherokee territory. Jackson ignored the decision in practice, showing the limits of judicial power without executive support." },
  { name:"Nullification Crisis", year:"1832–1833", era:"Early Republic", types:["political"], significance:"Tested whether states could nullify federal law and affirmed Union supremacy.", desc:"South Carolina declared federal tariffs null and void. Jackson threatened force while Henry Clay brokered a compromise tariff to defuse the crisis." },
  { name:"Bank War", year:"1832–1836", era:"Early Republic", types:["economic","political"], significance:"Destroyed the Second Bank and helped destabilize the economy before the Panic of 1837.", desc:"Jackson vetoed the recharter of the Second Bank of the United States and removed federal deposits. Supporters saw him as defending democracy against privilege; critics saw executive overreach." },
  { name:"Trail of Tears", year:"1838–1839", era:"Early Republic", types:["political","social"], significance:"Devastating example of federal treatment of Native peoples.", desc:"The Cherokee were forcibly marched west, and thousands died from exposure, disease, and starvation." },

  { name:"Seneca Falls Convention", year:"1848", era:"Antebellum", types:["social","political"], significance:"Launched the organized women's rights movement.", desc:"The first women's rights convention adopted the Declaration of Sentiments." },
  { name:"Mexican-American War", year:"1846–1848", era:"Antebellum", types:["war","foreign"], significance:"Greatly expanded U.S. territory and intensified conflict over slavery's expansion.", desc:"The U.S. defeated Mexico and acquired vast western lands, including present-day California and the Southwest. The war fueled charges that expansion was a pro-slavery project." },
  { name:"Wilmot Proviso", year:"1846", era:"Antebellum", types:["political","law"], significance:"Though it failed, it made slavery in the territories the central national issue.", desc:"This proposal would have banned slavery in any land acquired from Mexico. Southern outrage and Northern support revealed growing sectional polarization." },
  { name:"Compromise of 1850", year:"1850", era:"Antebellum", types:["law","political"], significance:"Temporarily averted Civil War but intensified sectional conflict through the Fugitive Slave Act.", desc:"Admitted California as free, used popular sovereignty in the Southwest, and strengthened fugitive slave enforcement." },
  { name:"Fugitive Slave Act", year:"1850", era:"Antebellum", types:["law","political","social"], significance:"Radicalized many Northerners by forcing them into the enforcement of slavery.", desc:"This stringent law required officials and citizens in free states to assist in returning escaped enslaved people. It stripped alleged fugitives of basic legal protections and intensified resistance." },
  { name:"Uncle Tom's Cabin Published", year:"1852", era:"Antebellum", types:["social"], significance:"Humanized slavery for many Northern readers and inflamed sectional feeling.", desc:"Harriet Beecher Stowe's novel became a mass cultural event and a major anti-slavery force." },
  { name:"Kansas-Nebraska Act", year:"1854", era:"Antebellum", types:["law","political"], significance:"Destroyed the Missouri Compromise and helped create the Republican Party.", desc:"Stephen Douglas's act organized western territories using popular sovereignty." },
  { name:"Bleeding Kansas", year:"1854–1859", era:"Antebellum", types:["social","political"], significance:"Showed that compromise over slavery had broken down into violence.", desc:"Pro-slavery and anti-slavery settlers fought over whether Kansas would enter the Union free or slave." },
  { name:"Republican Party Founded", year:"1854", era:"Antebellum", types:["political"], significance:"Created a major sectional party opposed to the expansion of slavery.", desc:"Former Whigs, Free Soilers, and anti-Nebraska Democrats formed a new party in response to the Kansas-Nebraska Act." },
  { name:"Dred Scott Decision", year:"1857", era:"Antebellum", types:["law"], significance:"Declared that Black Americans could not be citizens and that Congress could not ban slavery in the territories.", desc:"The Supreme Court's ruling polarized the nation." },
  { name:"Lincoln-Douglas Debates", year:"1858", era:"Antebellum", types:["political"], significance:"Nationalized the slavery debate and raised Lincoln's profile.", desc:"Debates over popular sovereignty, federal power, and the future of slavery defined the 1858 Illinois Senate campaign." },
  { name:"John Brown's Raid on Harper's Ferry", year:"1859", era:"Antebellum", types:["political","social"], significance:"Terrified the South and accelerated the march toward secession.", desc:"John Brown attempted to seize a federal arsenal and trigger a slave uprising." },
  { name:"Election of 1860", year:"1860", era:"Antebellum", types:["political"], significance:"Lincoln's victory triggered secession.", desc:"Lincoln won without Southern electoral support after the Democrats split." },
  { name:"Southern Secession", year:"1860–1861", era:"Antebellum", types:["political"], significance:"Led directly to the Civil War.", desc:"Southern states left the Union and formed the Confederacy." },

  { name:"Attack on Fort Sumter", year:"1861", era:"Civil War", types:["war"], significance:"Began the Civil War.", desc:"Confederate forces fired on the U.S. garrison in Charleston Harbor." },
  { name:"Homestead Act", year:"1862", era:"Civil War", types:["law","economic"], significance:"Accelerated western settlement by granting cheap land to settlers.", desc:"The federal government offered 160-acre plots to settlers willing to live on and improve the land. It reflected the Republican free-labor vision of opportunity and expansion." },
  { name:"Morrill Land-Grant Act", year:"1862", era:"Civil War", types:["law","education"], significance:"Expanded public higher education and linked colleges to agriculture and engineering.", desc:"Congress granted land to states to finance colleges focused on practical subjects. The act reshaped American higher education." },
  { name:"Pacific Railway Act", year:"1862", era:"Civil War", types:["law","technology","economic"], significance:"Laid the foundation for the transcontinental railroad.", desc:"The federal government supported railroad construction with land grants and loans. The measure linked Civil War Republican policy to national economic integration." },
  { name:"Emancipation Proclamation", year:"1863", era:"Civil War", types:["political","law"], significance:"Turned the war into a struggle against slavery and opened Union service to Black soldiers.", desc:"Lincoln declared enslaved people in Confederate-held territory free as a wartime measure." },
  { name:"Gettysburg & Vicksburg", year:"1863", era:"Civil War", types:["war"], significance:"Decisive turning point against the Confederacy.", desc:"Union victories at Gettysburg and Vicksburg shattered Confederate momentum." },
  { name:"13th Amendment Ratified", year:"1865", era:"Civil War", types:["law","social"], significance:"Abolished slavery permanently throughout the United States.", desc:"The 13th Amendment ended slavery except as punishment for crime." },
  { name:"Assassination of Lincoln", year:"1865", era:"Civil War", types:["political"], significance:"Removed the moderate force from Reconstruction politics.", desc:"Lincoln was shot by John Wilkes Booth shortly after Appomattox." },

  { name:"Freedmen's Bureau", year:"1865", era:"Reconstruction", types:["law","social"], significance:"Provided aid, schools, and legal support to formerly enslaved people.", desc:"Created at the end of the Civil War, the Freedmen's Bureau helped freedpeople and poor whites with food, labor contracts, education, and legal disputes. It became one of the most significant federal experiments in social welfare before the New Deal." },
  { name:"Black Codes", year:"1865–1866", era:"Reconstruction", types:["law","social"], significance:"Attempted to restore white control over Black labor and society after slavery.", desc:"Southern states passed restrictive laws limiting the freedom, movement, labor, and rights of freedpeople. Northern outrage over the Black Codes helped strengthen Radical Reconstruction." },
  { name:"Civil Rights Act of 1866", year:"1866", era:"Reconstruction", types:["law","civil rights"], significance:"First federal law defining national citizenship and protecting civil rights.", desc:"Congress overrode Andrew Johnson's veto to declare all persons born in the United States citizens and to protect basic legal rights regardless of race." },
  { name:"Reconstruction Acts", year:"1867", era:"Reconstruction", types:["law","political"], significance:"Placed the South under military rule and required new state constitutions guaranteeing Black male suffrage.", desc:"Congress divided the former Confederacy into military districts and required states to ratify the 14th Amendment and protect voting rights in order to be readmitted." },
  { name:"14th Amendment Ratified", year:"1868", era:"Reconstruction", types:["law"], significance:"Guaranteed citizenship, equal protection, and due process.", desc:"The 14th Amendment overturned Dred Scott and became the constitutional basis for later civil rights law." },
  { name:"15th Amendment Ratified", year:"1870", era:"Reconstruction", types:["law"], significance:"Granted Black men voting rights in theory, though later undermined by white terrorism and state restrictions.", desc:"The 15th Amendment prohibited denying the vote on the basis of race, color, or previous condition of servitude." },
  { name:"Ku Klux Klan Acts", year:"1870–1871", era:"Reconstruction", types:["law","civil rights"], significance:"Demonstrated federal willingness to use power against white supremacist violence.", desc:"Also called the Enforcement Acts, these measures targeted Klan intimidation and protected Black voting rights. They reflected the high-water mark of federal Reconstruction enforcement." },
  { name:"Civil Rights Act of 1875", year:"1875", era:"Reconstruction", types:["law"], significance:"Last major Reconstruction civil rights law; later struck down by the Supreme Court.", desc:"Banned discrimination in public accommodations and jury service." },
  { name:"Compromise of 1877", year:"1877", era:"Reconstruction", types:["political"], significance:"Ended Reconstruction and cleared the way for Jim Crow.", desc:"Federal troops withdrew from the South after the disputed 1876 election settlement." },

  { name:"Transcontinental Railroad Completed", year:"1869", era:"Gilded Age", types:["technology","economic"], significance:"Integrated the national economy and accelerated western settlement.", desc:"The first transcontinental railroad was completed at Promontory Summit, Utah." },
  { name:"Battle of Little Bighorn", year:"1876", era:"Gilded Age", types:["war","social"], significance:"Greatest Native victory against the U.S. Army, followed by harsher federal campaigns.", desc:"Lakota, Cheyenne, and Arapaho forces annihilated Custer's command." },
  { name:"Interstate Commerce Act", year:"1887", era:"Gilded Age", types:["law","economic"], significance:"First federal law aimed at regulating big business, especially railroads.", desc:"Responding to farmer and public anger over railroad rates and discrimination, Congress created the Interstate Commerce Commission. Though initially weak, it marked an important step toward federal economic regulation." },
  { name:"Dawes Act", year:"1887", era:"Gilded Age", types:["law","social"], significance:"Destroyed tribal landholding and undermined Native sovereignty.", desc:"The act divided communal tribal lands into private allotments and opened 'surplus' land to white settlement." },
  { name:"Sherman Antitrust Act", year:"1890", era:"Gilded Age", types:["law","economic"], significance:"First federal law against monopolies.", desc:"Congress outlawed business combinations in restraint of trade, though early enforcement was inconsistent." },
  { name:"Homestead Strike", year:"1892", era:"Gilded Age", types:["economic","social"], significance:"Major defeat for labor in the steel industry.", desc:"Violent conflict erupted between Carnegie Steel workers and Pinkerton guards in Pennsylvania." },
  { name:"Pullman Strike", year:"1894", era:"Gilded Age", types:["economic","social","law"], significance:"Showed the federal government would side against major labor disruptions.", desc:"A national rail boycott tied to wage cuts in Pullman was broken by injunctions and federal troops." },
  { name:"Plessy v. Ferguson", year:"1896", era:"Gilded Age", types:["law"], significance:"Established the 'separate but equal' doctrine that legalized Jim Crow segregation.", desc:"The Supreme Court upheld segregation in public accommodations." },
  { name:"Spanish-American War", year:"1898", era:"Gilded Age", types:["war","foreign"], significance:"Made the U.S. an overseas imperial power.", desc:"The U.S. defeated Spain and acquired Puerto Rico, Guam, and the Philippines." },
  { name:"Open Door Policy", year:"1899–1900", era:"Gilded Age", types:["foreign","economic"], significance:"Signaled growing U.S. interest in overseas markets and influence in Asia.", desc:"The U.S. proposed that all nations have equal trading access in China rather than exclusive colonial spheres. It reflected the era's connection between industrial expansion and foreign policy." },

  { name:"Pure Food and Drug Act", year:"1906", era:"Progressive Era", types:["law","social"], significance:"First major federal consumer protection law.", desc:"Passed after muckraking exposés, it regulated mislabeled and unsafe food and medicine." },
  { name:"Meat Inspection Act", year:"1906", era:"Progressive Era", types:["law","social"], significance:"Expanded federal oversight of food safety and meatpacking.", desc:"Prompted partly by public outrage over packinghouse conditions, the act required federal inspection of meat products." },
  { name:"Hepburn Act", year:"1906", era:"Progressive Era", types:["law","economic"], significance:"Strengthened federal regulation of railroads.", desc:"The act increased the Interstate Commerce Commission's power to set maximum railroad rates." },
  { name:"Muller v. Oregon", year:"1908", era:"Progressive Era", types:["law","social"], significance:"Upheld limits on women's working hours and introduced social science evidence into law.", desc:"The Supreme Court accepted the Brandeis Brief, which used data about health and welfare to defend labor legislation for women." },
  { name:"NAACP Founded", year:"1909", era:"Progressive Era", types:["civil rights","political"], significance:"Created one of the most important long-term civil rights organizations in U.S. history.", desc:"Founded by Black and white reformers including W.E.B. Du Bois, the NAACP pursued legal and political strategies against segregation and racial violence." },
  { name:"Triangle Shirtwaist Fire", year:"1911", era:"Progressive Era", types:["social","law"], significance:"Catalyzed labor and workplace safety reform.", desc:"Locked exits and unsafe conditions caused 146 workers to die in a factory fire." },
  { name:"16th Amendment", year:"1913", era:"Progressive Era", types:["law","political"], significance:"Established the federal income tax and transformed national fiscal capacity.", desc:"The amendment authorized Congress to levy an income tax without apportioning it among the states." },
  { name:"17th Amendment", year:"1913", era:"Progressive Era", types:["law","political"], significance:"Made senators directly elected by the people rather than chosen by state legislatures.", desc:"A major Progressive reform aimed at reducing corruption and making government more responsive." },
  { name:"Federal Reserve Act", year:"1913", era:"Progressive Era", types:["law","economic"], significance:"Created the modern central banking system.", desc:"The act established the Federal Reserve to regulate the money supply, stabilize banking, and respond to financial crises." },
  { name:"Clayton Antitrust Act", year:"1914", era:"Progressive Era", types:["law","economic"], significance:"Strengthened antitrust policy and exempted unions from being treated as illegal combinations.", desc:"Congress targeted unfair business practices more precisely than the Sherman Act and offered labor some protection from injunction abuse." },
  { name:"Federal Trade Commission Act", year:"1914", era:"Progressive Era", types:["law","economic"], significance:"Created a permanent federal watchdog over unfair business practices.", desc:"The Federal Trade Commission was established to investigate and curb deceptive or anticompetitive behavior." },
  { name:"World War I U.S. Entry", year:"1917", era:"Progressive Era", types:["war","foreign"], significance:"Shifted the U.S. into a global military role and expanded wartime state power.", desc:"German submarine warfare and the Zimmermann Telegram helped push the U.S. into WWI." },
  { name:"Espionage Act", year:"1917", era:"Progressive Era", types:["law","political"], significance:"Restricted antiwar dissent and expanded federal power during wartime.", desc:"The law criminalized interference with military operations and support for U.S. enemies during war. It became a major tool against critics of the war." },
  { name:"Sedition Act", year:"1918", era:"Progressive Era", types:["law","political"], significance:"Further limited free speech during wartime and the First Red Scare.", desc:"The law expanded penalties for speaking or writing against the government, military, or war effort." },
  { name:"18th Amendment (Prohibition)", year:"1919", era:"Progressive Era", types:["law","social"], significance:"Launched a failed social experiment that strengthened organized crime.", desc:"Banned the manufacture and sale of alcoholic beverages." },
  { name:"19th Amendment (Women's Suffrage)", year:"1920", era:"Progressive Era", types:["law","social"], significance:"Largest single expansion of the electorate in U.S. history at the time.", desc:"Prohibited denying the vote on the basis of sex." },

  { name:"Stock Market Crash", year:"1929", era:"New Deal", types:["economic"], significance:"Triggered the Great Depression.", desc:"The stock market collapsed after a period of speculation and overextension." },
  { name:"Hawley-Smoot Tariff", year:"1930", era:"New Deal", types:["law","economic"], significance:"Worsened global trade contraction during the Depression.", desc:"Congress raised tariffs on imports to protect American producers, but retaliatory tariffs abroad deepened the collapse of international trade." },
  { name:"Bonus Army", year:"1932", era:"New Deal", types:["political","social"], significance:"Damaged Hoover politically and symbolized the human cost of Depression hardship.", desc:"World War I veterans marched on Washington to demand early payment of promised bonuses. Hoover's use of federal force to remove them hurt his reputation badly." },
  { name:"New Deal", year:"1933–1938", era:"New Deal", types:["political","economic","law"], significance:"Permanently expanded the federal government's role in the economy and social welfare.", desc:"FDR created agencies and laws such as Social Security, the SEC, and the NLRA." },
  { name:"Agricultural Adjustment Act", year:"1933", era:"New Deal", types:["law","economic"], significance:"Marked a new federal role in managing agricultural production and prices.", desc:"The AAA paid farmers to reduce production in order to raise crop prices. It was controversial but important in redefining federal economic intervention." },
  { name:"Tennessee Valley Authority", year:"1933", era:"New Deal", types:["law","economic","technology"], significance:"Brought electricity, flood control, and development to a poor region.", desc:"The TVA built dams and power infrastructure across the Tennessee Valley, becoming one of the boldest examples of regional planning in U.S. history." },
  { name:"FDIC Created", year:"1933", era:"New Deal", types:["law","economic"], significance:"Restored trust in banks by insuring deposits.", desc:"As part of banking reform, the FDIC protected depositors and helped end waves of bank runs." },
  { name:"SEC Created", year:"1934", era:"New Deal", types:["law","economic"], significance:"Brought federal oversight to the stock market.", desc:"The Securities and Exchange Commission regulated securities markets and aimed to reduce fraud and reckless speculation." },
  { name:"Wagner Act (NLRA)", year:"1935", era:"New Deal", types:["law","economic","social"], significance:"Guaranteed workers the right to unionize and bargain collectively.", desc:"The National Labor Relations Act established federal protection for unions and created the National Labor Relations Board." },
  { name:"Social Security Act", year:"1935", era:"New Deal", types:["law","social"], significance:"Created the first permanent federal safety net.", desc:"Established retirement pensions, unemployment insurance, and aid programs." },
  { name:"Dust Bowl", year:"1930s", era:"New Deal", types:["social","economic"], significance:"Showed the environmental cost of unsustainable farming and drove mass migration.", desc:"Drought and poor land use created catastrophic dust storms across the Great Plains." },
  { name:"Fair Labor Standards Act", year:"1938", era:"New Deal", types:["law","social","economic"], significance:"Created the federal minimum wage and maximum-hour standards.", desc:"This act established a national minimum wage, overtime rules, and restrictions on child labor. It became a cornerstone of modern labor law." },

  { name:"Attack on Pearl Harbor", year:"1941", era:"WWII", types:["war","foreign"], significance:"Brought the U.S. into WWII.", desc:"Japan's surprise attack on Pearl Harbor led Congress to declare war." },
  { name:"Executive Order 9066", year:"1942", era:"WWII", types:["law","social"], significance:"Enabled Japanese American internment and became a lasting symbol of wartime civil liberties failure.", desc:"Roosevelt authorized the military exclusion of people from designated areas, a policy used to remove and incarcerate Japanese Americans from the West Coast." },
  { name:"Japanese American Internment", year:"1942–1945", era:"WWII", types:["law","social"], significance:"Flagrant wartime violation of civil liberties.", desc:"Approximately 120,000 Japanese Americans were forcibly relocated and incarcerated." },
  { name:"D-Day (Normandy Invasion)", year:"1944", era:"WWII", types:["war"], significance:"Opened a decisive Western Front against Nazi Germany.", desc:"Allied forces invaded Normandy on June 6, 1944." },

const eraOrder = ["Colonial","Revolution","Early Republic","Antebellum","Civil War","Reconstruction","Gilded Age","Progressive Era","WWI","1920s","New Deal","WWII","Cold War","Vietnam","Modern"];
const allEventTypes = ["war","law","political","economic","social","foreign","civil rights","technology"];

function buildPeopleApp() {
  const mainEl = document.getElementById('main');
  const eraFiltersDiv = document.getElementById('era-filters');
  const countEl = document.getElementById('count');
  const searchEl = document.getElementById('search');
  let activeEra = 'ALL';

  const allBtn = document.createElement('button');
  allBtn.className = 'era-btn active';
  allBtn.textContent = 'ALL';
  allBtn.dataset.era = 'ALL';
  eraFiltersDiv.appendChild(allBtn);

  eraOrder.forEach(era => {
    const btn = document.createElement('button');
    btn.className = 'era-btn';
    btn.textContent = era;
    btn.dataset.era = era;
    eraFiltersDiv.appendChild(btn);
  });

  eraFiltersDiv.addEventListener('click', e => {
    if (!e.target.classList.contains('era-btn')) return;
    document.querySelectorAll('.era-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    activeEra = e.target.dataset.era;
    renderPeople();
  });

  searchEl.addEventListener('input', renderPeople);

  function renderPeople() {
    mainEl.innerHTML = '';
    const q = searchEl.value.toLowerCase();
    let total = 0;

    eraOrder.forEach(era => {
      if (activeEra !== 'ALL' && activeEra !== era) return;
      const items = data.filter(p => {
        if (p.era !== era) return false;
        if (!q) return true;
        return p.name.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q) || p.tags.some(t => t.toLowerCase().includes(q));
      });
      if (!items.length) return;
      total += items.length;

      const section = document.createElement('div');
      section.className = 'era-section';
      section.innerHTML = `<div class="era-heading">${era.toUpperCase()}</div>`;
      const grid = document.createElement('div');
      grid.className = 'grid';

      items.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-name">${p.name}</div>
          <div class="card-dates">${p.dates}</div>
          <div class="card-desc">${p.desc}</div>
          <div>${p.tags.map(t=>`<span class="card-tag">${t}</span>`).join('')}</div>
        `;
        grid.appendChild(card);
      });

      section.appendChild(grid);
      mainEl.appendChild(section);
    });

    countEl.textContent = `${total} people`;
    if (!total) mainEl.innerHTML = '<div class="no-results">// NO RESULTS FOUND</div>';
  }

  renderPeople();
}

function buildEventsApp() {
  const eventsMainEl = document.getElementById('events-main');
  const typeFiltersDiv = document.getElementById('type-filters');
  const countEl = document.getElementById('event-count');
  const searchEl = document.getElementById('event-search');
  let activeType = 'ALL';

  const allBtn = document.createElement('button');
  allBtn.className = 'type-btn active';
  allBtn.textContent = 'ALL';
  allBtn.dataset.type = 'ALL';
  typeFiltersDiv.appendChild(allBtn);

  allEventTypes.forEach(type => {
    const btn = document.createElement('button');
    btn.className = 'type-btn';
    btn.textContent = type.toUpperCase();
    btn.dataset.type = type;
    typeFiltersDiv.appendChild(btn);
  });

  typeFiltersDiv.addEventListener('click', e => {
    if (!e.target.classList.contains('type-btn')) return;
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    activeType = e.target.dataset.type;
    renderEvents();
  });

  searchEl.addEventListener('input', renderEvents);

  function renderEvents() {
    eventsMainEl.innerHTML = '';
    const q = searchEl.value.toLowerCase();
    let total = 0;

    eraOrder.forEach(era => {
      const items = eventsData.filter(ev => {
        if (ev.era !== era) return false;
        if (activeType !== 'ALL' && !ev.types.includes(activeType)) return false;
        if (!q) return true;
        return ev.name.toLowerCase().includes(q) || ev.desc.toLowerCase().includes(q) || ev.significance.toLowerCase().includes(q);
      });
      if (!items.length) return;
      total += items.length;

      const section = document.createElement('div');
      section.className = 'events-era-section';
      section.innerHTML = `<div class="events-era-heading">${era.toUpperCase()}</div>`;
      const grid = document.createElement('div');
      grid.className = 'events-grid';

      items.forEach(ev => {
        const card = document.createElement('div');
        card.className = 'event-card';
        card.innerHTML = `
          <div class="event-year">${ev.year}</div>
          <div class="event-name">${ev.name}</div>
          <div class="event-desc">${ev.desc}</div>
          <div class="event-significance">⚑ ${ev.significance}</div>
          <div>${ev.types.map(t=>`<span class="event-tag type-${t}">${t.toUpperCase()}</span>`).join('')}</div>
        `;
        grid.appendChild(card);
      });

      section.appendChild(grid);
      eventsMainEl.appendChild(section);
    });

    countEl.textContent = `${total} events`;
    if (!total) eventsMainEl.innerHTML = '<div class="no-results">// NO RESULTS FOUND</div>';
  }

  renderEvents();
}

buildPeopleApp();
buildEventsApp();
